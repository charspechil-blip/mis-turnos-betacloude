<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<title>Mis Turnos</title>
<style>
:root{--m:#2878d0;--t:#e58b22;--f:#7a5cc7;--l:#20a35a;--tx:#202124;--mu:#6f6f6f;--ln:#e3e3e3;--bg:#f6f7f6;--cd:#fff;--on:#177a43}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark;--tx:#eee;--mu:#a0a0a0;--ln:#333;--bg:#101112;--cd:#1c1d1f;--on:#62d596}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-top:env(safe-area-inset-top)}
main{max-width:560px;margin:auto;padding:4px 12px calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;gap:8px;align-items:center;max-width:560px;margin:auto;padding:12px 12px 6px}
header b{flex:1;font-size:21px}
header button,.nav button{border:1px solid var(--ln);background:var(--cd);border-radius:12px;min-height:42px;padding:0 12px}
.bn{max-width:536px;margin:2px auto 6px;padding:8px 12px;border-radius:12px;background:#fff3d6;color:#5a4300;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bn button{border:1px solid #c9a94a;border-radius:10px;background:#fff;padding:4px 10px}
.m{--k:var(--m)}.t{--k:var(--t)}.f{--k:var(--f)}.l{--k:var(--l)}.u,.n{--k:#8a8a8a}
.c{font-style:normal;font-weight:800;font-size:11px;border-radius:6px;padding:1px 6px;color:#fff;background:var(--k)}
.hero,.cd{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-top:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.hero{text-align:center}.hero h2{margin:4px 0;font-size:26px;color:var(--k)}.hero p{margin:2px 0;color:var(--mu)}
.big{width:104px;height:104px;border-radius:50%;margin:8px auto;display:grid;place-items:center;font-size:48px;font-weight:800;color:#fff;background:var(--k,#8a8a8a)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row .cd{margin-top:10px}
.cd small,.lg{color:var(--mu);font-size:13px}.cd b{display:block;margin:4px 0}.lg{margin:10px 2px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.nav h2{margin:0;font-size:21px}.nav button{width:46px;font-size:22px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.wd{text-align:center;font-size:12px;font-weight:700;color:var(--mu)}
.d{border:1px solid var(--ln);background:var(--cd);border-radius:10px;min-height:56px;padding:5px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
.d.e{border-style:dashed;opacity:.7}.d.today{outline:2px solid var(--tx)}.d u{text-decoration:none;font-size:11px;color:var(--mu)}
.nm{border:1px solid var(--ln);background:var(--bg);border-radius:20px;padding:6px 12px;margin:4px 6px 0 0}.big2{display:block;width:100%;text-align:left;border-radius:12px}
.pri{width:100%;border:0;border-radius:14px;background:var(--l);color:#fff;font-weight:700;padding:14px;margin-top:12px}
label{display:block;margin-top:10px;font-size:14px;color:var(--mu)}input,select{display:block;width:100%;font:inherit;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--cd);color:var(--tx);margin-top:4px}
.pill{border:0;border-radius:20px;padding:4px 12px;color:#fff;background:#8a8a8a}.pill.Autorizado{background:var(--l)}.pill.Rechazado{background:#d64545}.pill.Pendiente{background:var(--t)}
.cd a{margin:0 10px}
#nv{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--cd);border-top:1px solid var(--ln)}
#nv button{border:0;background:none;border-radius:12px;padding:12px 2px;font-weight:700;color:var(--mu)}#nv .on{background:rgba(32,163,90,.18);color:var(--on)}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}#sh[hidden]{display:none}
.sb{background:var(--bg);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}.sb h3{margin:0 0 6px}.x{float:right;border:0;background:none;font-size:20px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #2878d0;outline-offset:2px}
.hero .big{box-shadow:0 0 0 9px rgba(138,138,138,.18)}
.d{font-weight:600}.wk .d{min-height:74px}.wk small{font-size:11px;color:var(--mu)}
.nm.sel{background:var(--l);border-color:var(--l);color:#fff}
.sum{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}.sum span{white-space:nowrap}
@supports (background:color-mix(in srgb,red,blue)){
.hero{background:linear-gradient(160deg,color-mix(in srgb,var(--k,#8a8a8a) 24%,var(--cd)),var(--cd) 75%)}
.hero .big{box-shadow:0 0 0 9px color-mix(in srgb,var(--k,#8a8a8a) 26%,transparent)}
.d.m,.d.t,.d.f,.d.l{background:color-mix(in srgb,var(--k) 14%,var(--cd))}
#nv .on{background:color-mix(in srgb,var(--l) 20%,transparent)}}
</style></head><body>
<header id="hd"></header><div id="bn"></div><main id="mn"></main><nav id="nv"></nav><div id="sh" hidden></div>
<input id="fl" type="file" accept=".xlsx,.xls,.xlsm,.json" hidden>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const MN=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"],DS=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
/* Feriados de Chile. Agregar los de 2027 cuando se publiquen. */
const HOL=new Set(["2026-11-01","2026-12-08","2026-12-25"]);
const H0={1:"07:00–15:00",2:"12:00–20:00",3:"08:00–16:00",4:"08:00–17:00"};
const $=i=>document.getElementById(i),pad=n=>String(n).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),mk=d=>ymd(d).slice(0,7);
const P=s=>new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));
const norm=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim().toUpperCase();
const nice=n=>String(n).toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const mon=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};

/* ---------- estado (todo queda en este teléfono) ---------- */
let S=(()=>{try{const j=JSON.parse(localStorage.getItem("mt2"));if(j&&j.months)return j}catch(e){}
 const s={months:{},me:null,swaps:[]};
 try{const o=JSON.parse(localStorage.getItem("turnosSchedules")||"{}");
  for(const k in o){let m=o[k];const f=Object.keys(m)[0];if(f===undefined)continue;if(/^\d+$/.test(f)||f==="L")m={"CHARLES PAREDES":m};
   s.months[k]={workers:{},hours:{}};for(const w in m)s.months[k].workers[w]={d:m[w]}}
  s.me=localStorage.getItem("turnosSelectedWorker")||null}catch(e){}
 return s})();
const save=()=>{try{localStorage.setItem("mt2",JSON.stringify(S))}catch(e){alert("No se pudo guardar en este teléfono (almacenamiento lleno o bloqueado).")}};
const V={tab:"hoy",cur:new Date(today().getFullYear(),today().getMonth(),1),w:null,ed:null,c1:""};
const names=()=>[...new Set(Object.keys(S.months).flatMap(k=>Object.keys(S.months[k].workers)))].sort((a,b)=>a.localeCompare(b,"es"));
const who=()=>V.w||S.me||names()[0];
const hrs=(k,c)=>{const m=S.months[k]||S.months[Object.keys(S.months).sort().pop()];return(m&&m.hours&&m.hours[c])||H0[c]||""};

/* ---------- turno de una persona en un día ---------- */
function est(w,d,off){let fx=null;const wk={};
 for(const k of Object.keys(S.months).sort()){const x=S.months[k].workers[w];if(!x)continue;fx=x.fixed?x:null;const[y,m]=k.split("-");
  for(const n in x.d){const c=x.d[n];if(typeof c!=="number")continue;const t=ymd(mon(new Date(+y,m-1,+n)));(wk[t]=wk[t]||{})[c]=(wk[t][c]||0)+1}}
 if(fx)return{v:off?"L":fx.fc,est:1};
 const ws=Object.keys(wk).sort().map(t=>{const e=Object.entries(wk[t]).sort((a,b)=>b[1]-a[1]);return{t,c:+e[0][0],n:e.reduce((s,x)=>s+x[1],0)}}).filter(x=>x.n>=3);
 if(!ws.length)return{};
 const l=ws[ws.length-1],p=[...ws].reverse().find(x=>x.c!==l.c),df=Math.round((mon(d)-P(l.t))/6048e5);
 if(df<1||df>8)return{};
 return{v:df%2?(p?p.c:l.c):l.c,est:1}}
function base(w,d){const x=(S.months[mk(d)]||{workers:{}}).workers[w],n=d.getDate(),g=d.getDay(),off=g==0||g==6||HOL.has(ymd(d));
 if(x)return x.fixed?{v:off?"L":(x.d[n]??x.fc)}:{v:x.d[n]};
 return est(w,d,off)}
let OV={};
function ovb(){OV={};for(const s of S.swaps){if(s.st!=="Autorizado")continue;const c1=base(s.w1,P(s.d1)).v,c2=base(s.w2,P(s.d2)).v;
 OV[s.w1+"|"+s.d1]="L";OV[s.w2+"|"+s.d1]=c1;OV[s.w2+"|"+s.d2]="L";OV[s.w1+"|"+s.d2]=c2}}
const val=(w,d)=>{const o=OV[w+"|"+ymd(d)];return o!==undefined?{v:o,sw:1}:base(w,d)};
const K=v=>v==="L"?"l":v===2?"t":v===4?"f":v===1||v===3?"m":v==="?"?"u":"n";
const LT={m:"M",t:"T",f:"F",l:"L",u:"?",n:"–"},LB={m:"Mañana",t:"Tarde",f:"Horario fijo",l:"Libre",u:"Otro código",n:"Sin dato"};
const chip=v=>{const k=K(v);return`<i class="c ${k}">${LT[k]}</i>`};

/* ---------- pantallas ---------- */
const fm=d=>DS[d.getDay()]+" "+d.getDate()+" "+MN[d.getMonth()].slice(0,3);
const nb=n=>`<button class="nm" data-a="see" data-v="${esc(n)}">${esc(nice(n))}</button>`;
function tHoy(){const w=who(),t=today(),r=val(w,t),k=K(r.v);let nx,nf;
 for(let i=1;i<=60&&!(nx&&nf);i++){const d=new Date(t);d.setDate(t.getDate()+i);const x=val(w,d);if(x.v==="L")nf=nf||d;else if(x.v!==undefined)nx=nx||{d,x}}
 const same=r.v!==undefined&&r.v!=="L"?names().filter(n=>n!==w&&val(n,t).v===r.v):[];
 const wk=[...Array(7)].map((_,i)=>{const d=new Date(t);d.setDate(t.getDate()+i);const x=val(w,d),kk=K(x.v);return`<button class="d ${kk}${x.est?" e":""}${i?"":" today"}" data-a="day" data-v="${ymd(d)}"><small>${DS[d.getDay()]}</small><span>${d.getDate()}</span>${chip(x.v)}</button>`}).join("");
 return`${IP?'<div class="cd"><b>Instala la app en tu teléfono</b><button class="pri" data-a="inst">Instalar</button></div>':""}<div class="hero ${k}"><p>${DS[t.getDay()]} ${t.getDate()} de ${MN[t.getMonth()]}</p><div class="big">${LT[k]}</div><h2>${LB[k]}</h2>
 <p>${typeof r.v==="number"?hrs(mk(t),r.v):""}${r.sw?" · cambio autorizado":""}${r.est?" · estimado":""}</p>${HOL.has(ymd(t))?"<p>Feriado</p>":""}</div>
 <div class="row"><div class="cd"><small>Próximo turno</small><b>${nx?fm(nx.d):"Sin datos"}</b>${nx?chip(nx.x.v)+" "+hrs(mk(nx.d),nx.x.v):""}</div>
 <div class="cd"><small>Próximo libre</small><b>${nf?fm(nf):"Sin datos"}</b></div></div>
 <div class="cd"><small>Próximos 7 días</small><div class="g wk">${wk}</div></div>
 ${same.length?`<div class="cd"><small>Hoy en tu mismo turno</small><div>${same.map(nb).join("")}</div></div>`:""}`}
function tCal(){const w=who(),y=V.cur.getFullYear(),m=V.cur.getMonth(),n=new Date(y,m+1,0).getDate(),st=(new Date(y,m,1).getDay()+6)%7,tt=ymd(today());
 const ct={};let g=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].map(x=>`<div class="wd">${x}</div>`).join("")+"<div></div>".repeat(st);
 for(let i=1;i<=n;i++){const d=new Date(y,m,i),r=val(w,d),k=K(r.v),s=ymd(d);ct[k]=(ct[k]||0)+1;
  g+=`<button class="d ${k}${r.est?" e":""}${s===tt?" today":""}" data-a="day" data-v="${s}"><span>${i}${HOL.has(s)?"•":""}</span>${chip(r.v)}${r.sw?"<u>↔</u>":""}</button>`}
 return`<div class="nav"><button data-a="prev" aria-label="Mes anterior">‹</button><h2>${MN[m]} ${y}</h2><button data-a="next" aria-label="Mes siguiente">›</button></div><div class="g">${g}</div><div class="cd sum"><small>Este mes</small>${["m","t","f","l"].filter(k=>ct[k]).map(k=>`<span><i class="c ${k}">${LT[k]}</i> ${ct[k]} ${LB[k].toLowerCase()}</span>`).join("")}</div>
 <p class="lg">${["m","t","f","l"].map(k=>`<i class="c ${k}">${LT[k]}</i> ${LB[k]}`).join(" &nbsp; ")}<br>• feriado · borde punteado = estimado (puede ser libre)</p>
 ${S.months[mk(V.cur)]?"":'<p class="lg">Este mes no está cargado: se muestra una estimación según la rotación.</p>'}`}
function grp(d){const g={};for(const n of names()){const r=val(n,d),k=K(r.v);(g[k]=g[k]||[]).push([n,r.v])}
 return["m","t","f","l","u","n"].filter(k=>g[k]).map(k=>`<div class="cd"><small>${LB[k]} (${g[k].length})</small><div>${g[k].map(([n,v])=>`<button class="nm" data-a="see" data-v="${esc(n)}">${esc(nice(n))}${typeof v==="number"?` <small>${hrs(mk(d),v)}</small>`:""}</button>`).join("")}</div></div>`).join("")}
function tEq(){const s=V.ed||ymd(today());return`<div class="cd"><label>Día<input type="date" id="ed" value="${s}"></label></div>${grp(P(s))}`}
function tCb(){const me=S.me;
 if(!me)return`<div class="hero"><p>Elige quién eres para registrar cambios.</p><button class="pri" data-a="pick">Elegir mi nombre</button></div>`;
 const f=s=>{const d=P(s);return DS[d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1)};
 const li=S.swaps.map(s=>{const msg=`Hola, acordamos cambiar turnos: ${nice(s.w1)} cede el ${f(s.d1)} y ${nice(s.w2)} cede el ${f(s.d2)}. ¿Lo autorizas?`;
  return`<div class="cd"><b>${esc(nice(s.w1))} cede ${f(s.d1)} ↔ ${esc(nice(s.w2))} cede ${f(s.d2)}</b>
  <button class="pill ${s.st}" data-a="st" data-v="${s.id}">${s.st}</button><a href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">WhatsApp</a><button data-a="del" data-v="${s.id}">Borrar</button></div>`}).join("")||'<p class="lg">Aún no hay cambios registrados.</p>';
 return`<div class="cd"><h3>Nuevo cambio</h3><label>Yo cedo el día<input type="date" id="c1" value="${V.c1}"></label>
 <label>Compañero<select id="c2">${names().filter(n=>n!==me).map(n=>`<option value="${esc(n)}">${esc(nice(n))}</option>`).join("")}</select></label>
 <label>Él cede el día<input type="date" id="c3"></label><button class="pri" data-a="add">Registrar cambio</button>
 <p class="lg">Toca el estado para pasar de Pendiente a Autorizado. El Excel no se modifica: un cambio autorizado se ve en el calendario con ↔ y solo en este teléfono.</p></div>${li}`}
const TAB={hoy:tHoy,cal:tCal,eq:tEq,cb:tCb};
function render(){ovb();const w=who();
 $("hd").innerHTML=`<b>Mis Turnos</b><button data-a="pick">${w?esc(nice(w)):"Elegir nombre"} ▾</button><button data-a="cfg" aria-label="Ajustes">⚙</button>`;
 $("bn").innerHTML=V.w&&V.w!==S.me?`<div class="bn">Viendo a ${esc(nice(V.w))}<button data-a="back">Volver a mí</button></div>`:"";
 $("nv").innerHTML=[["hoy","Hoy"],["cal","Calendario"],["eq","Equipo"],["cb","Cambios"]].map(([t,l])=>`<button data-a="tab" data-v="${t}"${V.tab===t?' class="on"':""}>${l}</button>`).join("");
 $("mn").innerHTML=names().length?TAB[V.tab]():`<div class="hero"><h2>Sin turnos cargados</h2><p>Sube el Excel del mes que envía la empresa.</p><button class="pri" data-a="load">Cargar Excel</button></div>`}
const sheet=h=>{$("sh").innerHTML=`<div class="sb"><button class="x" data-a="close" aria-label="Cerrar">✕</button>${h}</div>`;$("sh").hidden=false};
const close=()=>{$("sh").hidden=true};
const dl=(n,t,ty)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4e3)};

/* ---------- acciones ---------- */
const A={
 tab:v=>{V.tab=v;render()},
 prev:()=>{V.cur=new Date(V.cur.getFullYear(),V.cur.getMonth()-1,1);render()},
 next:()=>{V.cur=new Date(V.cur.getFullYear(),V.cur.getMonth()+1,1);render()},
 close,back:()=>{V.w=null;render()},load:()=>{close();$("fl").click()},
 see:n=>{V.w=n===S.me?null:n;V.tab="cal";close();render()},
 pick:()=>sheet(`<h3>${S.me?"Ver turnos de":"¿Quién eres?"}</h3>${names().map(n=>`<button class="nm big2" data-a="sel" data-v="${esc(n)}">${esc(nice(n))}${n===S.me?" (yo)":""}</button>`).join("")||"<p>Primero carga un Excel.</p>"}`),
 sel:n=>{if(!S.me){S.me=n;save()}else V.w=n===S.me?null:n;close();render()},
 reme:()=>{S.me=null;V.w=null;save();A.pick()},
 cfg:()=>sheet(`<h3>Ajustes</h3><p class="lg">Apariencia</p><div>${[["auto","Automático"],["light","Claro"],["dark","Oscuro"]].map(([v,l])=>`<button class="nm${(S.theme||"auto")===v?" sel":""}" data-a="th" data-v="${v}">${l}</button>`).join("")}</div>${IP?'<button class="pri" data-a="inst">Instalar app en este teléfono</button>':""}<button class="pri" data-a="load">Cargar Excel del mes</button><button class="pri" data-a="ics">Agregar mis turnos al calendario del teléfono</button>
  <button class="pri" data-a="bk">Guardar respaldo</button><button class="pri" data-a="load">Restaurar respaldo (.json)</button><button class="pri" data-a="reme">Cambiar mi nombre</button>
  <p class="lg">Los turnos se guardan solo en este teléfono. El calendario recibe cada turno con un aviso la tarde anterior (20:00).</p>
  <p class="lg">Para instalar: en Chrome toca ⋮ → «Instalar aplicación» (ábrela en Chrome, no desde GitHub). En iPhone: Compartir → «Añadir a pantalla de inicio».</p>`),
 day:s=>{const d=P(s),w=who(),r=val(w,d),k=K(r.v);
  sheet(`<h3>${DS[d.getDay()]} ${d.getDate()} de ${MN[d.getMonth()]}</h3><p>${esc(nice(w))}: <b>${LB[k]}</b> ${typeof r.v==="number"?hrs(mk(d),r.v):""}${r.est?" (estimado: puede ser libre)":""}${HOL.has(s)?" · Feriado":""}</p>
  ${S.me&&w===S.me&&typeof r.v==="number"?`<button class="pri" data-a="prop" data-v="${s}">Proponer cambio</button>`:""}${grp(d)}`)},
 prop:s=>{close();V.tab="cb";V.c1=s;render()},
 add:()=>{const d1=$("c1").value,d2=$("c3").value,w2=$("c2").value;if(!d1||!d2||!w2){alert("Completa los dos días y el compañero.");return}
  S.swaps.push({id:Date.now(),w1:S.me,d1,w2,d2,st:"Pendiente"});V.c1="";save();render()},
 st:id=>{const s=S.swaps.find(x=>x.id==id),o=["Pendiente","Autorizado","Rechazado"];s.st=o[(o.indexOf(s.st)+1)%3];save();render()},
 del:id=>{if(confirm("¿Borrar este cambio?")){S.swaps=S.swaps.filter(x=>x.id!=id);save();render()}},
 bk:()=>dl("mis-turnos-respaldo.json",JSON.stringify(S),"application/json"),
 ics:()=>{const w=S.me||who();if(!w){alert("Elige tu nombre primero.");return}
  const st=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";let o="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Mis Turnos//ES\r\n",c=0;
  for(const k of Object.keys(S.months).sort()){const[y,m]=k.split("-").map(Number);
   for(let i=1;i<=new Date(y,m,0).getDate();i++){const d=new Date(y,m-1,i),r=val(w,d);if(typeof r.v!=="number")continue;
    const t=hrs(k,r.v).match(/(\d{1,2}):(\d{2})\D+(\d{1,2}):(\d{2})/);if(!t)continue;const f=(h,mi)=>ymd(d).replace(/-/g,"")+"T"+pad(+h)+mi+"00";
    o+=`BEGIN:VEVENT\r\nUID:${norm(w).replace(/ /g,"")}-${ymd(d)}@misturnos\r\nDTSTAMP:${st}\r\nDTSTART:${f(t[1],t[2])}\r\nDTEND:${f(t[3],t[4])}\r\nSUMMARY:Turno ${LB[K(r.v)].toLowerCase()}\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:Mañana trabajas\r\nTRIGGER:-PT${240+(+t[1])*60+(+t[2])}M\r\nEND:VALARM\r\nEND:VEVENT\r\n`;c++}}
  if(!c){alert("No hay turnos para exportar.");return}dl("mis-turnos.ics",o+"END:VCALENDAR\r\n","text/calendar");close()}
};

/* ---------- importar el Excel de la empresa ---------- */
const MM=[["ENERO","ENE"],["FEBRERO","FEB"],["MARZO","MAR"],["ABRIL","ABR"],["MAYO","MAY"],["JUNIO","JUN"],["JULIO","JUL"],["AGOSTO","AGO"],["SEPTIEMBRE","SETIEMBRE","SEPT","SEP","SET"],["OCTUBRE","OCT"],["NOVIEMBRE","NOV"],["DICIEMBRE","DIC"]];
const tok=t=>norm(t).split(/[^A-Z0-9]+/);
const mIdx=t=>{for(const x of tok(t)){const i=MM.findIndex(a=>a.includes(x));if(i>=0)return i}return -1};
const yIdx=t=>tok(t).find(x=>/^20\d\d$/.test(x));
const STOP=/^(TURNO|TURNOS|NOMBRE|NOMBRES|MANANA|TARDE|LIBRE|REEMPLAZO|TOTAL|TOTAL GENERAL)$/;
const cod=v=>{if(v==null)return;const t=norm(v);if(t==="")return;if(t==="L"||t==="LIBRE")return"L";const n=Number(v);return typeof v!=="boolean"&&Number.isInteger(n)&&n>=1&&n<=4?n:"?"};
function dayRows(rows){const out=[];rows.forEach((row,r)=>{const pos=[],seen=new Set();
 (row||[]).forEach((v,c)=>{const n=+v;if(v!==null&&v!==""&&typeof v!=="boolean"&&Number.isInteger(n)&&n>=1&&n<=31&&!seen.has(n)){seen.add(n);pos.push({c,n})}});
 if(pos.length>=7&&pos.some((x,i)=>x.n==1&&pos[i+1]&&pos[i+1].n==2&&pos[i+2]&&pos[i+2].n==3))out.push({r,pos})});return out}
async function imp(f){
 if(/\.json$/i.test(f.name)){try{const j=JSON.parse(await f.text());if(!j.months)throw 0;if(!confirm("Esto reemplaza los datos actuales de la app. ¿Continuar?"))return;S=j;save();render()}catch(e){alert("Ese respaldo no es válido.")}return}
 if(!window.XLSX){alert("No se pudo cargar el lector de Excel. Conéctate a internet una vez e inténtalo de nuevo.");return}
 try{const wb=XLSX.read(await f.arrayBuffer(),{});const W={},hr={},hs=[];let mo=-1,yr=0;
  for(const sn of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null}),dr=dayRows(rows);if(!dr.length)continue;hs.push({rows,dr});
   if(mo<0){outer:for(const r of rows.slice(0,15))for(const c of r)if(typeof c==="string"&&mIdx(c)>=0){mo=mIdx(c);yr=+yIdx(c)||0;break outer}}
   rows.forEach((row,r)=>{const h=dr.filter(x=>x.r<r).pop();
    row.forEach((v,c)=>{const m=typeof v==="number"&&v>=1&&v<=4&&typeof row[c+1]==="string"&&row[c+1].match(/(\d{1,2}):(\d{2})\D+(\d{1,2}):(\d{2})/);if(m)hr[v]=pad(+m[1])+":"+m[2]+"–"+pad(+m[3])+":"+m[4]});
    if(!h)return;
    for(const v of row){const nm=norm(v);if(typeof v!=="string"||/\d/.test(v)||STOP.test(nm)||nm.split(" ").length<2)continue;
     const d={};let rec=0;for(const{c,n}of h.pos){const x=cod(row[c]);if(x!==undefined){d[n]=x;if(x==="L"||typeof x==="number")rec++}}
     if(rec>=2)W[nm]={...W[nm],...d};break}})}
  if(mo<0)mo=mIdx(f.name);if(!yr)yr=+yIdx(f.name)||0;
  if(mo<0){alert("No encontré el mes en el archivo. Revisa que el título lo incluya, por ejemplo «TURNO NOVIEMBRE 2026».");return}
  if(!yr)yr=new Date().getFullYear();
  const ns=Object.keys(W);if(!ns.length){alert("No encontré trabajadores con turnos en este archivo.");return}
  let ok=0,tot=0;for(const{rows,dr}of hs)for(const h of dr){const L=rows[h.r-1]||[];for(const{c,n}of h.pos){tot++;if(norm(L[c])==="DLMMJVS"[new Date(yr,mo,n).getDay()])ok++}}
  const days=new Date(yr,mo+1,0).getDate(),WK={},inc=[];let fx=0;
  for(const nm of ns){const d=W[nm],vals=Object.values(d),codes=new Set(vals.filter(x=>typeof x==="number")),
   wend=Object.keys(d).filter(n=>{const g=new Date(yr,mo,+n).getDay();return(g==0||g==6)&&d[n]!=="L"}).length,
   fixed=!vals.includes("L")&&codes.size===1&&wend===0&&vals.length>=10;
   WK[nm]={d,fixed,fc:fixed?[...codes][0]:undefined};if(fixed)fx++;else if(vals.length<days)inc.push(nm)}
  const msg=`${MN[mo]} ${yr}\n${ns.length} trabajadores (${fx} con horario fijo)`+(tot&&ok<tot*.8?"\n⚠ Los días de la semana del archivo no coinciden con este mes. ¿Es el archivo correcto?":"")+(inc.length?"\n⚠ Con días sin dato: "+inc.map(nice).join(", "):"")+"\n\n¿Importar?";
  if(!confirm(msg))return;
  S.months[yr+"-"+pad(mo+1)]={workers:WK,hours:hr};V.cur=new Date(yr,mo,1);V.tab="cal";save();render();if(!S.me)A.pick();
 }catch(e){alert("No se pudo leer este archivo: "+(e.message||e))}}

document.addEventListener("click",e=>{if(e.target.id==="sh")return close();const t=e.target.closest("[data-a]");if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.v)});
document.addEventListener("change",e=>{if(e.target.id==="ed"){V.ed=e.target.value;render()}});
$("fl").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)imp(f)};
let IP=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();IP=e;render()});
addEventListener("appinstalled",()=>{IP=null;render()});
A.inst=()=>{if(IP){IP.prompt();IP=null;close();render()}};
const mq=matchMedia("(prefers-color-scheme: dark)");
function theme(){const t=S.theme||"auto",d=t==="dark"||(t==="auto"&&mq.matches),m=document.querySelector('meta[name=theme-color]');
 document.documentElement.dataset.theme=d?"dark":"light";if(m)m.content=d?"#101112":"#ffffff"}
mq.addEventListener("change",theme);
A.th=v=>{S.theme=v;save();theme();A.cfg()};
theme();render();if(names().length&&!S.me)A.pick();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
